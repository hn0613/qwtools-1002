<!DOCTYPE HTML>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Server Fields</title>
    <style type="text/css">
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #2c3e50; }
    </style>
  </head>
  <body>
    <!-- Status bar: connection state, last update, field count -->
    <div id="status-bar"></div>

    <!-- Toolbar: search input + group toggle -->
    <div class="rvdas-toolbar">
      <input id="rvdas-search-input" class="rvdas-search-input"
             type="text" placeholder="搜索字段名、设备、描述...">
      <button id="group-toggle-btn" class="rvdas-group-btn">按设备分组</button>
    </div>

    <!-- Data table container -->
    <div id="field-table"></div>

    <!-- Scripts: settings first, then jQuery, then reusable components -->
    <script src="../js/widgets/settings.js"></script>
    <script src="../js/jquery/jquery-3.6.3.min.js"></script>
    <script src="../js/widgets/connection_manager.js"></script>
    <script src="../js/widgets/status_bar.js"></script>
    <script src="../js/widgets/data_table.js"></script>

    <script type="text/javascript">
    //////////////////////////////////////////////////////////////////////////
    // Page-specific wiring for fields.html
    // Connects ConnectionManager, StatusBar, and DataTable to display
    // field metadata from the CachedDataServer via its 'describe' protocol.
    //////////////////////////////////////////////////////////////////////////

    // --- 1. StatusBar --------------------------------------------------
    var status_bar = new StatusBar('status-bar', {
      title: 'Data Server Fields',
      stale_threshold: 10,
      dead_threshold: 30
    });

    // --- 2. DataTable ---------------------------------------------------
    var data_table = new DataTable('field-table', [
      {key: 'field_name',        label: 'Field Name',        sortable: true},
      {key: 'description',       label: 'Description',       sortable: true},
      {key: 'units',             label: 'Units',             sortable: true},
      {key: 'device',            label: 'Device',            sortable: true},
      {key: 'device_type',       label: 'Device Type',       sortable: true},
      {key: 'device_type_field', label: 'Device Type Field', sortable: true}
    ], {
      row_id_key: 'field_name',
      groupable: true,
      group_key: 'device',
      on_filter_change: function(shown, total) {
        status_bar.set_field_count(shown, total);
      }
    });

    // Bind search input (element already in DOM above)
    data_table.bind_search_input();

    // --- 3. Group toggle button ----------------------------------------
    var group_btn = document.getElementById('group-toggle-btn');
    var grouping_active = false;
    group_btn.addEventListener('click', function() {
      grouping_active = !grouping_active;
      data_table.set_grouping(grouping_active);
      if (grouping_active) {
        group_btn.classList.add('rvdas-active');
      } else {
        group_btn.classList.remove('rvdas-active');
      }
    });

    // --- 4. Describe request scheduling --------------------------------
    var describe_timer = null;
    var DESCRIBE_INTERVAL = 3000;

    function schedule_describe() {
      clear_describe_timer();
      describe_timer = setTimeout(function() {
        conn.send({type: 'describe'});
      }, DESCRIBE_INTERVAL);
    }

    function clear_describe_timer() {
      if (describe_timer !== null) {
        clearTimeout(describe_timer);
        describe_timer = null;
      }
    }

    // --- 5. Describe response → DataTable row array --------------------
    function describe_to_rows(data_dict) {
      var rows = [];
      var field_names = Object.keys(data_dict);
      for (var i = 0; i < field_names.length; i++) {
        var name = field_names[i];
        var meta = data_dict[name] || {};
        rows.push({
          field_name:        name,
          description:       meta.description,
          units:             meta.units,
          device:            meta.device,
          device_type:       meta.device_type,
          device_type_field: meta.device_type_field
        });
      }
      return rows;
    }

    // --- 6. ConnectionManager ------------------------------------------
    var conn = new ConnectionManager(WEBSOCKET_DATA_SERVER, {
      retry_interval: 3000,

      on_state_change: function(state) {
        status_bar.set_connection_state(state);
      },

      on_open: function() {
        // First describe request as soon as connected
        conn.send({type: 'describe'});
      },

      on_close: function() {
        // Stop polling; table retains last data so the user can still read it
        clear_describe_timer();
      },

      on_message: function(raw) {
        var message;
        try {
          message = JSON.parse(raw);
        } catch (e) {
          console.warn('[fields] Failed to parse message: ' + e);
          return;
        }

        if (message.type !== 'describe') {
          console.log('[fields] Ignoring message type: ' + message.type);
          schedule_describe();
          return;
        }

        if (message.status !== 200) {
          console.warn('[fields] Describe returned status ' + message.status +
                       (message.error ? ': ' + message.error : ''));
          schedule_describe();
          return;
        }

        var data_dict = message.data;
        if (!data_dict || typeof data_dict !== 'object') {
          console.warn('[fields] Describe response has no data');
          schedule_describe();
          return;
        }

        var rows = describe_to_rows(data_dict);
        data_table.set_data(rows);
        status_bar.mark_updated();

        // Schedule next poll
        schedule_describe();
      }
    });

    // --- 7. Start ------------------------------------------------------
    conn.connect();

    // --- 8. Cleanup on page unload -------------------------------------
    window.onbeforeunload = function() {
      clear_describe_timer();
      conn.close();
    };
    </script>
  </body>
</html>
