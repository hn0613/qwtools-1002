<!DOCTYPE HTML>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Server Fields</title>
    <style type="text/css">
      /* ---- Page-level reset and base ---- */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
        background: #1a2634;
        color: #ecf0f1;
        min-height: 100vh;
      }

      /* ---- No-JS fallback banner ---- */
      .rvdas-noscript {
        padding: 16px; text-align: center;
        background: #c0392b; color: #fff; font-size: 15px;
      }

      /* ---- Page toolbar (search + group button + count) ---- */
      .rvdas-page-toolbar {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px;
        background: #34495e; border-bottom: 1px solid #4a6278;
      }
      .rvdas-page-toolbar .rvdas-search-input {
        flex: 1; min-width: 200px; padding: 7px 12px;
        font-size: 14px; border: 1px solid #5a7a94;
        border-radius: 4px; background: #2c3e50; color: #ecf0f1;
        outline: none;
      }
      .rvdas-page-toolbar .rvdas-search-input:focus {
        border-color: #3498db;
        box-shadow: 0 0 0 2px rgba(52,152,219,0.3);
      }
      .rvdas-page-toolbar .rvdas-search-input::placeholder { color: #7f8c8d; }
      .rvdas-page-toolbar .rvdas-group-btn {
        padding: 7px 14px; font-size: 13px; cursor: pointer;
        border: 1px solid #5a7a94; border-radius: 4px;
        background: #2c3e50; color: #bdc3c7; white-space: nowrap;
        transition: background 0.15s, border-color 0.15s;
      }
      .rvdas-page-toolbar .rvdas-group-btn:hover { background: #3d566e; }
      .rvdas-page-toolbar .rvdas-group-btn.rvdas-active {
        background: #2980b9; color: #fff; border-color: #3498db;
      }
      .rvdas-page-toolbar .rvdas-field-count {
        font-size: 13px; color: #95a5a6; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- NoScript fallback -->
    <noscript>
      <div class="rvdas-noscript">
        此页面需要 JavaScript 才能运行。请启用 JavaScript 或检查浏览器设置。
      </div>
    </noscript>

    <!-- Settings must load first (defines WEBSOCKET_DATA_SERVER) -->
    <script src="../js/widgets/settings.js"></script>

    <!-- jQuery (optional convenience, used by other pages in this project) -->
    <script src="../js/jquery/jquery-3.6.3.min.js"></script>

    <!-- Reusable modules (order matters: no inter-module deps, but all before page script) -->
    <script src="../js/widgets/connection_manager.js"></script>
    <script src="../js/widgets/status_bar.js"></script>
    <script src="../js/widgets/data_table.js"></script>

    <!-- Status bar (connection state + last update time) -->
    <div id="status-bar-container"></div>

    <!-- Toolbar: search input + group toggle button -->
    <div class="rvdas-page-toolbar">
      <input type="text"
             id="rvdas-search-input"
             class="rvdas-search-input"
             placeholder="搜索字段名、描述、设备…"
             autocomplete="off"
             spellcheck="false">
      <button id="group-by-device-btn"
              class="rvdas-group-btn"
              type="button">按设备分组</button>
      <span id="rvdas-field-count" class="rvdas-field-count"></span>
    </div>

    <!-- Data table container (DataTable module renders here) -->
    <div id="field-table-container"></div>

    <!-- Page-specific script (must be last) -->
    <script src="../js/fields_page.js"></script>
  </body>
</html>
